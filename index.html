<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For You</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="password-screen">
    <div class="pass-card">
      <h2>Enter Password</h2>
      <input type="password" id="pass-input" placeholder="Enter code">
      <button onclick="checkPassword()">Unlock</button>
      <p id="error-msg"></p>
    </div>
  </div>

  <!-- MAIN PAGE CONTENT -->
  <div id="main-content">
    <nav class="navbar">
      <span class="logo">JamesFlix</span>
      <div class="profile-icon">A</div>
    </nav>

    <div class="hero">
      <p class="subhead">A MESSAGE FOR YOU</p>
      <h1>Dear Sabrina</h1>
      <p class="body-text">Some things are easier to say when the world gets quiet. So I made this little place for everything I wanted you to hear.</p>
      <div class="buttons">
        <button class="btn primary">▶ Read message</button>
        <button class="btn secondary">Read Comments</button>
      </div>
    </div>

    <!-- AUDIO PLAYER BAR -->
    <div class="audio-player">
      <div class="track-info">
        <p class="episode">EPISODE 01 · THE THINGS I COULDN'T SAY</p>
        <p class="song-title">Damned</p>
      </div>
      <div class="controls">
        <button class="play-btn">❚❚</button>
      </div>
    </div>
  </div>

  <script>
    function checkPassword() {
      const secret = "Anton"; // PASSWORD SET HERE
      const input = document.getElementById("pass-input").value;
      if (input === secret) {
        document.getElementById("password-screen").style.display = "none";
        document.getElementById("main-content").style.display = "block";
      } else {
        document.getElementById("error-msg").innerText = "Wrong password!";
      }
    }
  </script>
</body>
</html>
